          - {method: name_trigger, text: "поговори с отцом"}
          - {method: name_trigger, text: "у батюшки спроси"}
          - {method: name_trigger, text: "вот дед даёт"}
          - {method: name_trigger, text: "с дедом не поспоришь"}
          - {method: name_trigger, text: "федерация и дедлайн"}
          - {method: name_trigger, text: "Федяев опять опоздал"}
          - {method: name_trigger, text: "отечество в опасности"}
          - {method: name_trigger, text: "ФЁДОР"}
          - {method: mentions_bot, text: "@golden_bot привет"}
          - {method: mentions_bot, text: "привет@golden_bot"}
          - {method: mentions_bot, text: "@golden_botik привет"}
          - {method: mentions_bot, text: "@GOLDEN_BOT привет"}

  - id: C_patterns_filters
    group: C
    desc: "the regex lists of the gate and filters on canned probes"
    seed: *chat
    actions:
