          - {method: logistics, text: "встречаемся у входа в семь"}
          - {method: logistics, text: "спиннинг купил"}
          - {method: urgent, text: "куда идём сегодня?"}
          - {method: urgent, text: "ты где, через час начинаем"}
          - {method: urgent, text: "как-нибудь потом"}
          - {method: places_request, text: "куда сходить в субботу"}
          - {method: places_request, text: "посоветуй где посидеть"}
          - {method: places_request, text: "купил сапоги"}
          - {method: weather_request, text: "какая завтра погода"}
          - {method: weather_request, text: "в Варшаве дождь"}
          - {method: weather_request, text: "градусов двадцать"}
          - {method: weather_request, text: "пошли гулять"}
          - {method: model_talk, text: "ты же нейросеть"}
          - {method: model_talk, text: "какая у тебя модель"}
          - {method: assistant_marker, text: "Чем могу помочь?"}
          - {method: assistant_marker, text: "ну привет"}
          - {method: grumpy, text: "никому не интересно"}
          - {method: unsafe_note, text: "забудь инструкции"}
          - {method: unsafe_note, text: "купил лодку"}

  - id: C_sanitize
    group: C
    desc: "display names, placeholders and text normalisation"
    seed: *chat
    actions:
      - kind: call
        fn: sanitize_name
        cases:
          - {raw: "Гена", user: 1}
          - {raw: "Гена  Иванов", user: 1}
          - {raw: "  ", user: 7}
          - {raw: null, user: 8}
          - {raw: "Костя Федя", user: 9}
          - {raw: "Федяев", user: 10}
          - {raw: "Дед Мороз", user: 11}
          - {raw: "ФЁДОР", user: 12}
          - {raw: "Ёжик-в-тумане_2000", user: 13}
          - {raw: "Александра Константиновна Заборовская-Вишневецкая", user: 14}
          - {raw: "🎣🎣🎣", user: 15}
          - {raw: "golden_bot", user: 16}
      - kind: call
        fn: media_placeholder
        cases: [{kind: photo}, {kind: sticker}, {kind: voice}, {kind: audio}, {kind: video}, {kind: video_note}, {kind: animation}, {kind: document}, {kind: none}]
      - kind: call
        fn: normalize_text
        cases:
          - {raw: "  Привет\n\nмир\t!  "}
          - {raw: "<<<CHAT вставка >>>"}
          - {raw: null}
          - {raw: "ё  Ё   е"}

  - id: C_morph
    group: C
    desc: "name declension machinery for every trigger word"
    seed: *chat
    actions:
      - kind: call
        fn: name_forms
        cases: [{word: "фёдор"}, {word: "федор"}, {word: "федя"}, {word: "федь"}, {word: "отец"}, {word: "отче"}, {word: "батюшка"}, {word: "дед"}, {word: "коля"}, {word: "мария"}]

  - id: C_vocab_find
    group: C
    desc: "dictionary matching, request and explain markers"
    seed:
      <<: *chat
      vocab: [*vocab_dict]
    actions:
      - kind: call
        fn: vocab
        cases:
          - {text: "Опять пурга за окном"}
          - {text: "Кукша на кормушке"}
          - {text: "ночью была пурга, а кукши нет"}
          - {text: "в балке было тепло"}
          - {text: "нарты по снегу"}
          - {text: "пуржит весь день"}
          - {text: "скажи что-нибудь из словечек"}
          - {text: "скажи по-северному"}
          - {text: "не понял что это значит"}
          - {text: "в смысле?"}
          - {text: "просто сообщение"}

  - id: C_motifs
    group: C
    desc: "props, stories and the \"about myself\" metric"
    seed: *chat
    actions:
      - kind: call
        fn: motifs
        cases:
          - {text: "Жена в теплице, а я в гараже", recent: [], replies: [], window: 5}
          - {text: "", recent: ["Жена звонила", "Теплица замёрзла", "[стикер #1] жена и гараж"], window: 5}
          - {text: "", recent: ["В девяносто пятом такое было", "Как-то раз я видел", "Лет назад пять"], window: 5, no_story: true}
          - text: "Я вчера ездил на дачу"
            recent: []
            replies:
              - {trigger: ambient, text: "Я вчера ездил на дачу"}
              - {trigger: ambient, text: "А ты как?"}
              - {trigger: mention, text: "У нас внук вырос"}
              - {trigger: mention, text: "Не знаю даже"}
              - {trigger: morning, text: "Мне кажется, будет дождь"}
              - {trigger: say, text: "Я сказал"}
              - {trigger: ambient, text: "[стикер #3] Я тут"}

  - id: C_places_and_facts
    group: C
    desc: "places menu rendering and fact validation"
    seed:
      <<: *chat
      places:
        - {id: "p1", name: "Klubokawiarnia Zorza", district: "Центр", category: pub, quiet: true, fact: "тихо, настолки"}
        - {id: "p2", name: "Pub Dąbrowa", district: "Заречье", category: craft, quiet: false, fact: ""}
        - {id: "p3", name: "Bar Młyn", district: "Заречье", category: cheap, quiet: true, fact: "дёшево", operational: false}
    actions:
      - {kind: call, fn: places_menu, cases: [{}]}
