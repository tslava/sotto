name: CI

on:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check src tests tools

      - name: Format check (ruff format)
        run: uv run ruff format --check src tests tools

      - name: Type check (mypy)
        run: uv run mypy

      - name: Tests (pytest, with coverage)
        run: uv run pytest -q --cov --cov-report=json

      - name: Coverage gate (total >= 93 %, new modules >= 95 %)
        run: uv run python -m tools.coverage_gate

      - name: Language gate (report only)
        run: uv run python -m tools.check_language
