name: Badges

# Publishes the coverage badge data (a shields.io endpoint JSON) to the orphan branch `badges`.
# Kept out of ci.yml on purpose: ci.yml is also called by deploy.yml, and a reusable workflow
# that asks for `contents: write` would need the caller to grant it. Runs only on pushes to
# main, never on pull requests, so forks cannot reach the write token.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  coverage-badge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Tests with coverage
        run: uv run pytest -q --cov --cov-report=json

      - name: Coverage gate
        run: uv run python -m tools.coverage_gate

      - name: Write badge data
        run: |
          python3 - <<'PY'
          import json
          pct = json.load(open("coverage.json"))["totals"]["percent_covered"]
          color = "brightgreen" if pct >= 90 else "yellow" if pct >= 75 else "red"
          badge = {"schemaVersion": 1, "label": "coverage", "message": f"{round(pct)}%", "color": color}
          json.dump(badge, open("/tmp/coverage-badge.json", "w"))
          PY

      - name: Push to the badges branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan badges
          git rm -rf --quiet .
          cp /tmp/coverage-badge.json coverage.json
          git add coverage.json
          git commit -m "Update coverage badge"
          git push --force origin badges
