[project]
name = "sotto"
version = "0.10.0"
description = "A Telegram group-chat regular: an engine that decides when a persona speaks, plus persona packs for who it is"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Wiaczesław Cyunczyk" }]
keywords = ["telegram", "bot", "llm", "persona", "aiogram", "group-chat"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.31",
    "aiosqlite>=0.22",
    "annotated-types>=0.8",
    "httpx>=0.28",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://tslava.dev/sotto.html"
Repository = "https://github.com/tslava/sotto"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "ruff>=0.16",
    "mypy>=2.3",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sotto"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]
# ruff format would rewrite python blocks inside markdown; CLAUDE.md is a contract,
# not runnable code (signatures without bodies, explanatory comments).
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
# Typographic dashes and non-Latin letters are deliberate: dash normalisation, date ranges
# in prompts and the Russian language module.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["sotto", "tools"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aiosqlite.*"]
ignore_missing_imports = true

[tool.coverage.run]
# src/ feeds the total floor, tools/ (and future src modules) the per-module floor:
# tools/coverage_gate.py.
source = ["src", "tools"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]
