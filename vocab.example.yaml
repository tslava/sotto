# Пример словаря словечек (CLAUDE.md, "словечки из словаря").
# Загрузить: отправь такой файл боту в личку с подписью /words. Файл с тем же name
# заменяет старый словарь. Свои словари в репозиторий не кладём: они живут в БД бота.
name: пример
about: словечки, которые ты привёз из дома       # одна строка для модели: откуда слова
words:
  - word: зюфа                                  # ударение можно ставить: зю́фа
    meaning: садись, давай, зов куда-то присесть
    example: Зюфа на лавку, пока не жарко.
  - word: кумонок
    meaning: ремень
    example: Кумонок дома забыл.
  - word: лостерка
    meaning: тёплая безрукавка, жилетка
    forms: [лостерка, лостерку, лостерке, лостеркой]   # необязательно: только эти формы
