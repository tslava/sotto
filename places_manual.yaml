# Ручные поля для кэша заведений (places_fill.py, CLAUDE.md/PLAN.md этап 5).
#
# Google не знает, можно ли где-то поговорить (quiet) и заведения категории
# определяет ненадёжно (price_level; см. PLAN.md, этап 5, п.4) — эти поля
# проставляются здесь руками и переопределяют то, что вернул Google.
#
# Сопоставление с результатом Google — по полю name: без учёта регистра, точным
# совпадением с displayName ИЛИ вхождением name в displayName (places_fill.py).
#
# category: craft | cheap | outskirts | pub
# district: переопределяет то, что places_fill.py определил по formattedAddress,
#           если задано; для --manual-only это единственный источник district.
#
# Стартовый список — CHARACTER.md, раздел 7, quiet по таблице.

- name: Złota Łapa
  quiet: false
  category: craft
  district: Dawne Miasto

- name: Dom Mąki
