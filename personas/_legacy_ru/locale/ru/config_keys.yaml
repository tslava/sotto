config_keys:
  persona.name: Имя персонажа
  persona.display_name: Имя профиля бота в Telegram
  persona.name_triggers: Слова-обращения к персонажу без @, по границам слов
  persona.birth_date: Дата рождения; возраст считается на лету
  persona.arrived_wolsan: Год переезда в Волсань
  persona.district: Родной район, который персонаж защищает
  persona.timezone: Таймзона персонажа для суток и окон времени
  behaviour.quiet_window: Окно полной тишины, включая прямые обращения
  behaviour.morning_reply_window: Окно утренней реплики всем, кто звал ночью; момент случайный
  behaviour.live_talk.min_messages: Минимум сообщений в окне для живого разговора
  behaviour.live_talk.min_people: Минимум разных людей в окне для живого разговора
  behaviour.live_talk.window_min: Окно в минутах, за которое считается разговор
  behaviour.ambient_probability: Шанс ambient-реплики внутри живого разговора
  behaviour.chat_cooldown_min: Минимум минут между ambient-репликами
  behaviour.daily_cap: Суточный лимит ambient и «просто так» вместе
  behaviour.spontaneous.per_week: Сколько раз в неделю можно написать «просто так»
  behaviour.spontaneous.window: Окно времени HH:MM-HH:MM для «просто так»
  behaviour.spontaneous.min_quiet_hours: Часов тишины подряд перед репликой «просто так»
  behaviour.reactions.enabled: Включает реакции-эмодзи вместо молчания
  behaviour.reactions.probability: Шанс поставить реакцию, когда она возможна
  behaviour.reactions.cooldown_min: Не чаще одной реакции в N минут
  behaviour.reactions.daily_cap: Потолок реакций в сутки, отдельно от ambient/mention
  behaviour.reactions.emoji: Эмодзи -> когда уместно (видит модель); только из набора реакций Telegram
  behaviour.reactions.max_repeat: Одно эмодзи не больше N раз подряд; 0 — без ограничения
  behaviour.reactions.delay_sec: 'Пауза перед реакцией: прочитал и хмыкнул, а не мгновенно, [мин, макс]'
  behaviour.reactions.semantic: Реакцию выбирает дешёвая модель; false — прежний кубик
  behaviour.reactions.model: Модель выбора реакции; пусто -> llm.judge_model
  behaviour.reactions.max_tokens: Потолок ответа модели реакции, токенов (с размышлением модели)
  behaviour.reactions.semantic_daily_cap: Потолок вызовов модели на реакции в сутки
  behaviour.reactions.context_messages: Сколько последних сообщений чата показать модели
  behaviour.stickers.enabled: Включает отправку стикеров вместо текста
  behaviour.stickers.min_replies_between: Текстовых реплик должно пройти после стикера до следующего
  behaviour.stickers.daily_cap: Потолок стикеров в сутки
  behaviour.stickers.recent_window: Столько последних использованных стикеров не повторять
  behaviour.stickers.model: Модель для выбора стикера; пусто -> llm.judge_model
  behaviour.stickers.max_tokens: Лимит токенов ответа модели-чузера стикеров
  behaviour.hot_window.enabled: Включает горячее окно после /life и /say
  behaviour.hot_window.minutes: Длительность горячего окна после /life и /say
  behaviour.hot_window.mention_max_delay_sec: Потолок задержки ответа на обращение в горячем окне
  behaviour.hot_window.ambient_probability: Шанс ambient-реплики в горячем окне вместо ambient_probability
  behaviour.hot_window.ambient_cap: Потолок ambient-реплик за одно горячее окно
  behaviour.hot_window.open_on_any_reply: Открывать горячее окно после любой реплики, не только /life и /say
  behaviour.followup.enabled: Включает дешёвую проверку «это мне?» в горячем окне
  behaviour.followup.model: Модель для проверки «это мне?»; пусто -> llm.judge_model
  behaviour.followup.max_tokens: Лимит токенов ответа дешёвой проверки
  behaviour.followup.daily_cap: Потолок вызовов дешёвой проверки в сутки, свой счётчик
  behaviour.followup.context_messages: Сколько сообщений чата дать дешёвой проверке
  behaviour.followup.recent_replies: Сколько последних реплик Фёдора дать проверке
  behaviour.followup.name_check: Обращение по имени подтверждает дешёвая модель, а не только регулярка
  behaviour.followup.name_check_max_tokens: Лимит токенов ответа проверки обращения по имени
  behaviour.checkin.enabled: Включает периодическую проверку «вернулся»
  behaviour.checkin.after_min: Минут после закрытия горячего окна до проверки, [мин, макс]
  behaviour.checkin.topic_max_hours: Часов без реплик бота — тема считается умершей
  behaviour.checkin.max_messages: Сколько сообщений после последней реплики брать
  behaviour.checkin.poll_sec: Период фонового цикла checkin_job, сек
  behaviour.checkin.quiet_min: Минут тишины в чате перед проверкой «вернулся»; писали позже — отложить
  behaviour.checkin.prefilter: Дешёвая проверка пачки сообщений перед основной моделью
  behaviour.checkin.prefilter_max_tokens: Лимит токенов ответа дешёвого предфильтра
  behaviour.presence.enabled: Включает суточный потолок присутствия бота
  behaviour.presence.max_share: Доля реплик бота от сообщений людей за локальные сутки
  behaviour.presence.free_replies: 'Реплик в сутки сверх доли: на утро пустого чата'
  behaviour.chat_memory.enabled: Включает пересказы прошедших разговоров
  behaviour.chat_memory.period_days: Длина одного периода пересказа в сутках
  behaviour.chat_memory.run_window: Окно локального времени HH:MM для прогона памяти
  behaviour.chat_memory.in_prompt: Сколько последних пересказов класть в промпт
  behaviour.chat_memory.keep_days: Сколько суток хранить пересказы в БД
  behaviour.chat_memory.max_messages: Потолок сообщений на один пересказ, берутся последние
  behaviour.chat_memory.max_chars: Потолок длины одного пересказа в символах
  behaviour.chat_memory.max_tokens: Лимит токенов ответа модели на пересказ
  behaviour.chat_memory.model: Модель для пересказа; пусто -> llm.main_model
  behaviour.chat_memory.backfill_periods: Сколько прошлых периодов догнать при первом прогоне
  behaviour.diary.enabled: 'Включает дневник дня: факты о себе из реплик'
  behaviour.diary.model: Модель извлечения факта; пусто -> llm.judge_model
  behaviour.diary.max_tokens: Лимит токенов ответа модели на извлечение факта
  behaviour.diary.daily_cap: Вызовов извлечения в сутки, счётчик diary_calls
  behaviour.diary.week_days: Сколько прошлых суток показывать строкой «на неделе»
  behaviour.diary.keep_days: Сколько суток хранить факты в БД
  behaviour.jokes.enabled: Включает память о общих шутках чата
  behaviour.jokes.per_period: Сколько шуток доставать из одного недельного периода
  behaviour.jokes.in_prompt: Сколько шуток класть в системный промпт
  behaviour.jokes.cooldown_days: Сколько суток не показывать уже использованную шутку
  behaviour.vocab.enabled: Включает словечки из словарей /words
  behaviour.vocab.probability: Шанс предложить словечки модели в одной реплике
  behaviour.vocab.daily_cap: Сколько словечек в сутки он может употребить
  behaviour.vocab.recent_window: Столько последних реплик должно пройти без словечек до следующего
  behaviour.vocab.offer_size: Сколько словечек на выбор предложить модели
  behaviour.vocab.meaning_context: В скольких последних сообщениях искать словечко, чтобы дать значение
  behaviour.vocab.max_meanings: Сколько значений словечек класть в промпт за раз
  behaviour.vocab.request_markers: 'Просьба сказать словечком (регулярки); ещё имя словаря: «по-дворовому»'
  behaviour.vocab.request_size: Сколько словечек показать модели, когда его попросили
  behaviour.vocab.explain_markers: Регулярки «не понял, что это значит» — после его словечка это вопрос ему
  behaviour.vocab.explain_window_min: Сколько минут после его словечка «не понял» считается вопросом ему
  behaviour.vocab.explain_max_between: Больше стольких сообщений людей после его словечка — «не понял» уже не ему
  behaviour.callback.enabled: Включает вопросы «ну как там?» людям
  behaviour.callback.min_days: Не чаще одного вопроса «ну как там?» в столько суток
  behaviour.callback.max_age_days: История старше этого срока в сутках не спрашивается
  behaviour.callback.author_active_days: Автор истории должен писать в чат за столько суток
  behaviour.callback.window: Окно локального времени HH:MM для вопроса
  behaviour.vision.enabled: Включает описание фото моделью со зрением
  behaviour.vision.model: Модель со зрением для описания фото; пусто -> llm.main_model
  behaviour.vision.max_tokens: Лимит токенов ответа модели со зрением
  behaviour.vision.daily_cap: Потолок описаний фото в сутки, свой счётчик
  behaviour.vision.ambient_probability: Шанс описать фото, присланное без повода (не обращение, не окно)
  behaviour.vision.max_width: Берётся самый большой размер фото не шире этого, пикселей
  behaviour.vision.max_chars: Потолок длины описания фото, символов
  behaviour.weather.enabled: Включает погоду в системном промпте (Open-Meteo, без ключа)
  behaviour.weather.ttl_min: Сколько минут ответ о погоде считается свежим
  behaviour.weather.timeout_sec: Таймаут запроса к Open-Meteo, секунд
  behaviour.weather.place_lookup: Искать погоду по месту, про которое спросили в обращении
  behaviour.weather.lookup_model: Дешёвая модель, достающая место из вопроса; пусто -> llm.judge_model
  behaviour.weather.lookup_max_tokens: Лимит токенов ответа модели, достающей место
  behaviour.weather.lookup_daily_cap: Потолок таких вызовов в сутки, счётчик weather_calls
  behaviour.weather.geocode_ttl_days: Сколько дней помнятся координаты найденного места
  behaviour.weather.geocode_language: Код языка, на котором геокодер отдаёт названия мест
  behaviour.weather.home_country_codes: Коды стран (ISO), которые не дописываются к названию места
  behaviour.weather.home_country_names: Названия домашней страны (без регистра), если геокодер не дал код
  behaviour.mention_cooldown_sec: Кулдаун ответа на обращение, на человека, сек
  behaviour.mention_chat_cooldown_sec: Кулдаун ответа на обращение, на чат, сек
  behaviour.mention_daily_cap: Суточный лимит ответов на прямые обращения
  behaviour.reply_as_reply_after_sec: После скольких секунд отвечать реплаем, а не просто в чат
  behaviour.debounce_sec: 'Диапазон дебаунса: копит очередь сообщений перед ответом'
  behaviour.reply_delay_buckets: Бакеты задержки ответа на обращение, вес и диапазон секунд
  behaviour.urgent_max_delay_sec: Потолок задержки для срочных сообщений («сегодня», «сейчас»)
  behaviour.late_reply_threshold_sec: После скольких секунд ответ считается поздним
  behaviour.context_window: Сколько последних сообщений даётся модели в контекст
  behaviour.recent_replies_memory: Сколько последних реплик бота помнится для дедупликации
  behaviour.topic_cooldown_min: Минуты молчания после срабатывания стоп-листа на входе
  behaviour.message_retention_days: Сколько дней хранятся сообщения перед удалением
  behaviour.min_gap_sec: Минимум секунд между любыми двумя сообщениями бота в чате
  llm.provider: Провайдер LLM, OpenAI-совместимый API
  llm.main_model: Id основной модели в OpenRouter
  llm.judge_model: Маленькая дешёвая модель-судья (выходной фильтр), другой вендор
  llm.timeout_sec: Таймаут запроса к модели, сек
  llm.max_tokens: Лимит токенов ответа основной модели
  llm.daily_calls_cap: Потолок попыток вызова модели в сутки, судья считается
  llm.daily_budget_usd: Суточный бюджет в долларах; сверх — молчит
  llm.circuit_errors: Ошибок подряд для срабатывания предохранителя
  llm.circuit_pause_min: Минуты паузы после срабатывания предохранителя
  llm.alert_owner: Писать владельцу в личку, если провайдер отказывает (4xx)
  llm.alert_interval_hours: Не чаще раза в столько часов на один код ответа
  llm.price_in_usd_per_1m: Fallback-цена входных токенов за 1M, если нет usage.cost
  llm.price_out_usd_per_1m: Fallback-цена выходных токенов за 1M, если нет usage.cost
  places.min_rating: Минимальный рейтинг заведения для белого списка
  places.min_reviews: Минимум отзывов у заведения для белого списка
  places.require_operational: Учитывать только действующие (не закрытые) заведения
  places.cache_ttl_days: Раз во сколько дней перегонять кэш скриптом наполнения
  places.max_per_reply: Максимум заведений, упомянутых в одной реплике
  places.queries: Поисковые запросы для офлайн-наполнения кэша заведений (places_fill.py)
  places.search_center: Широта и долгота центра поиска заведений (places_fill.py)
  places.region_code: Код региона поиска Google Places (ISO 3166-1 alpha-2)
  places.language_code: Код языка ответов Google Places (названия, отзывы)
  places.district_aliases: 'Районы: каноническое имя -> варианты написания (для выбора мест и district)'
  places.default_district: Район по умолчанию, если в адресе района не нашлось
  places.quiet_keywords: Слова в просьбе, после которых выбираются только тихие места
  places.outskirts_keywords: Слова в просьбе, после которых выбираются места за городом
  filters.shadow: true = фильтры логируют, но не режут ответ (щадящий старт)
  filters.places_whitelist: Бытовые бренды, не заведения из CHARACTER.md раздел 7
  filters.allowed_emoji: Разрешённые эмодзи персонажа, небольшой набор, редко и к месту
  filters.emoji_max_per_reply: Максимум разрешённых эмодзи в одной реплике
  filters.emoji_recent_window: Окно последних реплик для проверки частоты эмодзи
  filters.known_places: Заведения из CHARACTER.md раздел 7, белый список regex:venue/regex:latin
  filters.polish_words: Польский словарь персонажа, белый список и предмет dedup:polish_freq
  filters.districts: 'Районы города: латиницей они не считаются выдуманным заведением'
  filters.latin_extra_letters: Буквы чужого алфавита сверх A-Za-z (диакритики), напр. польские
  filters.topic_stop: Стоп-лист тем (вход и выход), регулярки по границам слов
  filters.injection_markers: Маркеры команд управления ботом (входной гейт, шаг 5a)
  filters.logistics: 'Логистические фразы: время, «кто идёт», «я пас» — не мешать договорённостям'
  filters.urgent: Маркеры срочности («сегодня», «сейчас») — ускоряют бакет задержки ответа
  filters.places_request: Маркеры запроса про заведение («куда сходить», «посоветуй»)
  filters.weather_request: Маркеры разговора о погоде — повод узнать погоду в названном месте
  filters.model_talk: Маркеры разговора о модели/ИИ, которых персонаж не знает (выходной фильтр)
  filters.assistant_markers: Фразы-маркеры ассистента, не в характере персонажа (выходной фильтр)
  filters.grumpy_markers: Сухие/раздражённые формулировки не в характере персонажа (выходной фильтр)
  filters.enforce_stages: 'Стадии выходного фильтра, которые режут ответ даже при shadow: true'
  filters.motifs: 'Метка мотива -> регулярки реквизита: жена, теплица, гараж, девяностые'
  filters.motif_recent_window: 'Окно последних реплик: мотив из него режет кандидата (dedup:motif)'
  filters.motif_avoid_window: Окно последних реплик, чьи мотивы уходят в промпт слотом {{avoid}}
  filters.story_markers: 'Маркеры байки: «девяностые», «помню», «как-то раз» (квота историй)'
  filters.story_window: Окно последних реплик, в котором считается квота баек
  filters.self_markers: 'Маркеры «говорит о себе» (я, у меня, внук): только метрика в /status'
  filters.story_max: Сколько баек можно на окно story_window, дальше срез style:story_quota
