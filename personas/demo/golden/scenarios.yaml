# Golden scenarios for the English demo pack. All chat text below is invented.
# Time offsets are relative to the scenario clock (default 2026-11-04 12:00 local, a Wednesday):
# "-10m", "-2h", "-3d". Scenario ids start with their group letter (A..F, see tools/golden/README.md).
# 101 scenarios (groups A to F) for Gus Marlow's chat.
version: 1

# Values the harness uses where a scenario does not say otherwise.
defaults:
  home: {name: "Brindlemoor", lat: 52.0, lon: -1.5}   # weather: {home: default}; a neutral point
  guest_name: "Guest"
  place_name: "Elsewhere"
  callback_name: "Sam"

defs:
  users: &users {1: "Dana", 2: "Theo", 3: "Priya", 4: "Marcus", 5: "Jo"}
  chat: &chat
    users: *users
    messages:
      - {id: 101, user: 1, text: "So who's up for the canal walk on Saturday?", at: "-50m"}
      - {id: 102, user: 2, text: "I'd come if the weather holds", at: "-48m"}
      - {id: 103, user: 3, text: "I need to check on my mum's flat but I'm free by the evening", at: "-45m"}
      - {id: 104, user: 1, text: "Marcus, why so quiet?", at: "-40m"}
      - {id: 105, user: 4, text: "On shift till Friday, then we'll see", at: "-38m"}
      - {id: 106, user: 2, text: "Bought new walking boots yesterday, dying to try them", at: "-30m"}
      - {id: 107, user: 5, text: "Show us later, I'm curious which ones", at: "-28m"}
      - {id: 108, user: 2, text: "Sure, on Saturday I'll show you", at: "-25m"}
    bot_replies:
      - {id: 5001, text: "Boots are serious business, never skimp on the laces.", trigger: mention, at: "-20h"}
      - {id: 5002, text: "Walked it once, it was longer than I remembered.", trigger: name, at: "-19h"}
  judge_ok: &judge_ok '{"in_character": true, "risky": false, "obeyed_user": false, "reason": "ok"}'
  say_ok: &say_ok {speak: true, text: "Well, we'll see how it goes."}
  no_sticker: &no_sticker {sticker: null}
  no_fact: &no_fact {fact: null}
  place_rows: &place_rows
    - {id: "p1", name: "The Lantern Room", district: "Old Mill", category: pub, quiet: true, fact: "quiet, board games"}
    - {id: "p2", name: "Thistle and Anchor", district: "Lower Quay", category: craft, quiet: false, fact: "noisy at weekends"}
    - {id: "p3", name: "Barrow's Hatch", district: "Tannery Row", category: cheap, quiet: true, fact: "cheap"}
  vocab_dict: &vocab_dict |
    name: brindlemoor
    about: words they use on Kettle Hill
    words:
      - {word: snickerwick, meaning: a short sudden rain shower, example: "Just a snickerwick, give it five minutes."}
      - {word: bodgel, meaning: a clumsy home repair that only just holds, example: "The gate is a bodgel, mind how you shut it."}
      - {word: dreeper, meaning: someone who talks a lot and says little, example: "Don't mind him, he's a dreeper."}
      - {word: plimsey, meaning: a slow aimless stroll, example: "We had a plimsey by the canal."}

scenarios:
  # ------------------------------------------------------------------------------------------
  # A. Main prompt
  # ------------------------------------------------------------------------------------------
  - id: A_ambient
    group: A
    desc: "unsolicited reply inside a live conversation"
    seed: *chat
    llm: [*say_ok, *judge_ok]
    actions:
      - {kind: gate_pass, passes: [{trigger: ambient, user: 5, msg: 109, text: "Wonder what the canal is like in November"}]}

  - id: A_ambient_hot
    group: A
    desc: "hot window open (bot just spoke): different situation and counters"
    seed:
      <<: *chat
      state: {hot_until: "@5m", hot_ambient_count: "1"}
    llm: [*say_ok, *judge_ok]
    actions:
      - {kind: gate_pass, passes: [{trigger: ambient, user: 5, msg: 109, text: "Wonder what the canal is like in November"}]}

  - id: A_mention_single
    group: A
    seed: *chat
    llm: [{speak: true, text: "Walked it when I was young, mostly in the wrong boots."}, *judge_ok]
    actions:
      - {kind: gate_pass, passes: [{trigger: mention, user: 2, msg: 109, text: "@golden_bot have you ever walked the canal path?"}]}

  - id: A_mention_multi_collapse_3
    group: A
    desc: "three addresses collapse into one pending reply"
    seed: *chat
    llm: [*say_ok, *judge_ok]
    actions:
      - kind: gate_pass
        passes:
          - {trigger: mention, user: 2, msg: 109, text: "@golden_bot what do you think, shall we go on Saturday?"}
          - {trigger: name, user: 3, msg: 110, text: "Gus, would you come along?", advance: 15}
          - {trigger: mention, user: 4, msg: 111, text: "@golden_bot tell them Saturday is a bad idea", advance: 20}

  - id: A_mention_multi_cap_5
    group: A
    desc: "six addresses, only the last five reach the prompt"
    seed: *chat
    llm: [*say_ok, *judge_ok]
    actions:
      - kind: gate_pass
        passes:
          - {trigger: mention, user: 1, msg: 109, text: "@golden_bot first question, about the map"}
          - {trigger: mention, user: 2, msg: 110, text: "@golden_bot second question, about boots", advance: 8}
          - {trigger: mention, user: 3, msg: 111, text: "@golden_bot third question, about sandwiches", advance: 8}
          - {trigger: mention, user: 4, msg: 112, text: "@golden_bot fourth question, about the map", advance: 8}
          - {trigger: mention, user: 5, msg: 113, text: "@golden_bot fifth question, about the tent", advance: 8}
          - {trigger: mention, user: 1, msg: 114, text: "@golden_bot sixth question, about the flask", advance: 8}

  - id: A_reply_trigger
    group: A
    desc: "reply to a bot message"
    seed:
      <<: *chat
      messages:
        - {id: 101, user: 1, text: "So who's up for the canal walk on Saturday?", at: "-50m"}
        - {id: 106, user: 2, text: "Bought new walking boots yesterday, dying to try them", at: "-30m"}
        - {id: 5001, user: 999001, text: "Boots are serious business, never skimp on the laces.", at: "-20m", bot: true}
    llm: [{speak: true, text: "Waxed ones, they never give up."}, *judge_ok]
    actions:
      - kind: gate_pass
        passes:
          - {trigger: reply, user: 2, msg: 109, text: "Which laces, the flat ones or the round ones?", reply_to: 5001, reply_to_bot: true}

  - id: A_name_trigger
    group: A
    seed: *chat
    llm: [{speak: true, text: "Here, never went anywhere."}, *judge_ok]
    actions:
      - {kind: gate_pass, passes: [{trigger: name, user: 1, msg: 109, text: "Gus, where did you vanish to?"}]}

  - id: A_followup_single
    group: A
    seed: *chat
    llm: [{speak: true, text: "Sunday I could think about, yes."}, *judge_ok]
    actions:
      - {kind: gate_pass, passes: [{trigger: followup, user: 3, msg: 109, text: "What if we did Sunday, would that suit you better?"}]}

  - id: A_followup_multi
    group: A
    seed: *chat
    llm: [*say_ok, *judge_ok]
    actions:
      - kind: gate_pass
        passes:
          - {trigger: followup, user: 3, msg: 109, text: "What if we did Sunday, would that suit you better?"}
          - {trigger: followup, user: 4, msg: 110, text: "Sunday is better for me too", advance: 10}

  - id: A_late_reply
    group: A
    desc: "pending restored after a restart, answered late"
    seed:
      <<: *chat
      messages:
        - {id: 101, user: 1, text: "So who's up for the canal walk on Saturday?", at: "-50m"}
        - {id: 109, user: 2, text: "@golden_bot do you have a spare pair of boots?", at: "-20m"}
      pending:
        - {trigger_msg: 109, user: 2, trigger: mention, due: "-1m", created: "-20m"}
    llm: [{speak: true, text: "One pair, old, but they work."}, *judge_ok]
    actions:
      - {kind: restore_pending}
    capture: [requests, sent, db]

  - id: A_morning
    group: A
    desc: "one reply to everyone who called at night"
    clock: "2026-11-04 07:30:00"
    seed:
      <<: *chat
      messages:
        - {id: 101, user: 1, text: "Morning folks", at: "-30m"}
        - {id: 201, user: 2, text: "@golden_bot are you asleep?", at: "-5h"}
        - {id: 202, user: 3, text: "Gus, when you wake up tell us about the storm", at: "-4h"}
      night:
        - {id: 201, user: 2, text: "@golden_bot are you asleep?", at: "-5h"}
        - {id: 202, user: 3, text: "Gus, when you wake up tell us about the storm", at: "-4h"}
    llm: [{speak: true, text: "Awake now, I was only being quiet."}, *judge_ok]
    actions:
      - {kind: morning}
    capture: [requests, sent, db]

  - id: A_spontaneous
    group: A
    desc: "the bot speaks first when the chat is quiet"
    seed:
      users: *users
      messages:
        - {id: 101, user: 1, text: "So who's up for the canal walk on Saturday?", at: "-5h"}
        - {id: 102, user: 2, text: "I'd come if the weather holds", at: "-5h"}
      bot_replies:
        - {id: 5001, text: "Boots are serious business, never skimp on the laces.", trigger: mention, at: "-6h"}
    config: {behaviour.spontaneous.per_week: "50"}
    llm: [{speak: true, text: "Sitting here sorting screws by size."}, *judge_ok]
    actions:
      - {kind: spontaneous}
    capture: [requests, sent, db]

  - id: A_checkin_rows
    group: A
    desc: "came back to check: cheap prefilter, then the main model with numbered rows"
    seed:
      users: *users
      messages:
        - {id: 101, user: 1, text: "So who's up for the canal walk on Saturday?", at: "-5h"}
        - {id: 102, user: 2, text: "Gus, what do you say about Saturday?", at: "-100m"}
        - {id: 103, user: 3, text: "Looks like the weather will hold", at: "-90m"}
        - {id: 104, user: 4, text: "Marlow, will you bring your flask?", at: "-80m"}
      bot_replies:
        - {id: 5001, text: "Walked it once, it was longer than I remembered.", trigger: name, at: "-3h"}
      state:
        hot_until: "@-150m"
        checkin_due_hot_until: "@-150m"
        checkin_due: "@-10m"
    llm:
      - {addressed: [1, 3]}
      - {speak: true, text: "Flask comes along, the rest we'll see.", reply_to: 3}
      - {addressed: true, reason: "used his name"}
      - *judge_ok
    actions:
      - {kind: checkin}
    capture: [requests, sent, db]

  - id: A_callback
    group: A
    desc: "asks a person how it ended, days later"
    seed:
      users: *users
      messages:
        - {id: 101, user: 2, text: "So who's up for the canal walk on Saturday?", at: "-2h"}
        - {id: 102, user: 3, text: "I'd come, but I have an interview on Thursday", at: "-26h"}
      threads:
        - {user: 3, text: "waiting for a call from the garage about a new job", at: "-4d"}
    llm: [{speak: true, text: "Priya, how did the interview go, did they ring?"}, *judge_ok]
    actions:
      - {kind: callback}
    capture: [requests, sent, db]

  - id: A_life_announce
    group: A
    desc: "owner pushes a life event; the bot tells the chat"
    seed: *chat
    llm: [{speak: true, text: "Sold my old bandstand stool, got a taller one."}, *judge_ok]
    actions:
      - {kind: life, text: "sold the old bandstand stool, bought a taller one"}

  - id: A_places_menu_present
    group: A
    desc: "places cache goes into the prompt for any direct address"
    seed:
      <<: *chat
      places: *place_rows
    llm: [{speak: true, text: "The Lantern Room is decent, it's quiet there."}, *judge_ok]
    actions:
      - {kind: gate_pass, passes: [{trigger: mention, user: 3, msg: 109, text: "@golden_bot recommend somewhere quiet to sit", advance: 5}]}

  - id: A_places_empty
    group: A
    seed: *chat
    llm: [{speak: true, text: "Couldn't say, haven't been out in ages."}, *judge_ok]
    actions:
      - {kind: gate_pass, passes: [{trigger: mention, user: 3, msg: 109, text: "@golden_bot recommend somewhere quiet to sit"}]}
    capture: [requests, sent, db]

  - id: A_places_request_trigger_rename
    group: A
    desc: "the bot_replies.trigger becomes \"places\" when the regex matches"
    seed:
      <<: *chat
      places: *place_rows
    llm: [{speak: true, text: "The Lantern Room is decent, it's quiet there."}, *judge_ok]
    actions:
      - {kind: gate_pass, passes: [{trigger: mention, user: 3, msg: 109, text: "@golden_bot where should we go on Saturday evening?"}]}
    capture: [requests, sent, db]

  - id: A_weather_home
    group: A
    desc: "weather question; the extractor finds no place, only the home block is used"
    seed: *chat
    llm: [{place: null}, {speak: true, text: "Damp, but bearable."}, *judge_ok]
    actions:
      - {kind: gate_pass, passes: [{trigger: mention, user: 1, msg: 109, text: "@golden_bot what's the weather tomorrow?"}]}

  - id: A_weather_place_extra
    group: A
    desc: "weather in another city comes from the geocoder"
    seed: *chat
    weather:
      places:
        Lisbon: {name: Lisbon, latitude: 38.72, longitude: -9.14, country: Portugal, country_code: PT}
    llm: [{place: "Lisbon"}, {speak: true, text: "Lisbon, they say, is drier."}, *judge_ok]
    actions:
      - {kind: gate_pass, passes: [{trigger: mention, user: 1, msg: 109, text: "@golden_bot and what's the weather in Lisbon tomorrow?"}]}

  - id: A_weather_none
    group: A
    desc: "no home point configured: the home weather block is empty"
    seed: *chat
    weather: {home: none}
    llm: [*say_ok, *judge_ok]
    actions:
      - {kind: gate_pass, passes: [{trigger: ambient, user: 5, msg: 109, text: "Wonder what the canal is like in November"}]}

  - id: A_diary_today_week
    group: A
    seed:
      <<: *chat
      diary:
        - {text: "gone to the market", at: "-2h"}
        - {text: "mending a fence", at: "-30h"}
        - {text: "painting the gate", at: "-3d"}
    llm: [*say_ok, *judge_ok]
    actions:
      - {kind: gate_pass, passes: [{trigger: name, user: 2, msg: 109, text: "Gus, what are you up to today?"}]}

  - id: A_life_events_list
    group: A
    seed:
      <<: *chat
      life:
        - {text: "sold the old stool, bought a taller one", at: "-9d"}
        - {text: "changed his glasses", at: "-2d"}
    llm: [*say_ok, *judge_ok]
    actions:
      - {kind: gate_pass, passes: [{trigger: name, user: 2, msg: 109, text: "Gus, how are things with you generally?"}]}

  - id: A_chat_memory_3_periods
    group: A
    seed:
      <<: *chat
      memory:
        - {start: "-21d", end: "-14d", text: "Dana showed off a new bike.\nPriya was looking for a flat near the river."}
        - {start: "-14d", end: "-7d", text: "Argued about boots, Marcus picked the waxed ones."}
        - {start: "-7d", end: "-1h", text: "Theo was planning a walk on Saturday."}
    llm: [*say_ok, *judge_ok]
    actions:
      - {kind: gate_pass, passes: [{trigger: name, user: 2, msg: 109, text: "Gus, remember what we talked about last week?"}]}

  - id: A_jokes_with_cooldown
    group: A
    seed:
      <<: *chat
      jokes:
        - {text: "Theo's lucky boots", at: "-10d"}
        - {text: "the strategic pigeon", at: "-8d", used_at: "-1d"}
        - {text: "tea o'clock", at: "-2d"}
    llm: [*say_ok, *judge_ok]
    actions:
      - {kind: gate_pass, passes: [{trigger: name, user: 2, msg: 109, text: "Gus, why so quiet?"}]}

  - id: A_vocab_offer
    group: A
    desc: "dice forced to 1: a few words are offered for the reply"
    seed:
      <<: *chat
      vocab: [*vocab_dict]
    config: {behaviour.vocab.probability: "1.0"}
    llm: [{speak: true, text: "Quiet enough, bar the odd snickerwick."}, *judge_ok]
    actions:
      - {kind: gate_pass, passes: [{trigger: name, user: 2, msg: 109, text: "Gus, how is it up there generally?"}]}

  - id: A_vocab_request
    group: A
    desc: "asked for a word from the dictionary by name"
    seed:
      <<: *chat
      vocab: [*vocab_dict]
    llm: [{speak: true, text: "A plimsey is a stroll, nowhere in particular."}, *judge_ok]
    actions:
      - {kind: gate_pass, passes: [{trigger: name, user: 2, msg: 109, text: "Gus, say something in your dialect, you have words for it"}]}

  - id: A_vocab_explain_meanings
    group: A
    desc: "a dictionary word shows up in the chat, the meaning goes into the prompt"
    seed:
      <<: *chat
      vocab: [*vocab_dict]
      messages:
        - {id: 101, user: 1, text: "Another snickerwick outside the window", at: "-10m"}
    llm: [{speak: true, text: "Snickerwick, that's a short shower."}, *judge_ok]
    actions:
      - {kind: gate_pass, passes: [{trigger: name, user: 2, msg: 109, text: "Gus, what is a snickerwick?"}]}

  - id: A_avoid_motifs_no_story
    group: A
    desc: "recent replies are full of props and stories: the avoid block asks for no story"
    seed:
      <<: *chat
      bot_replies:
        - {id: 5001, text: "My sister rang about the clocks again, and I was in the shed all day.", trigger: ambient, at: "-20h"}
        - {id: 5002, text: "Back in the nineties that happened, I remember once the whole depot flooded.", trigger: ambient, at: "-19h"}
        - {id: 5003, text: "At least the shed is quiet, the tuba stays home.", trigger: mention, at: "-18h"}
    llm: [*say_ok, *judge_ok]
    actions:
      - {kind: gate_pass, passes: [{trigger: ambient, user: 5, msg: 109, text: "Wonder what the canal is like in November"}]}

  - id: A_photo_and_sticker_in_context
    group: A
    desc: "persisted placeholders in the context and in recent replies"
    seed:
      <<: *chat
      messages:
        - {id: 101, user: 1, text: "[photo: a man holding a huge marrow on a jetty] Look at the size of this", at: "-30m"}
        - {id: 102, user: 2, text: "[sticker]", at: "-28m"}
        - {id: 103, user: 3, text: "[voice message]", at: "-26m"}
        - {id: 104, user: 4, text: "[video]", at: "-24m"}
        - {id: 105, user: 5, text: "[file]", at: "-22m"}
      bot_replies:
        - {id: 5001, text: "[sticker #3] Let me think about it.", trigger: ambient, at: "-20h"}
        - {id: 5002, text: "Fine marrow, congratulations.", trigger: mention, at: "-19h"}
    llm: [*say_ok, *judge_ok]
    actions:
      - {kind: gate_pass, passes: [{trigger: name, user: 2, msg: 109, text: "Gus, did you see the marrow Dana grew?"}]}

  - id: A_empty_recent_replies
    group: A
    desc: "an empty bot history and almost empty context"
    seed:
      users: *users
    llm: [*say_ok, *judge_ok]
    actions:
      - {kind: gate_pass, passes: [{trigger: mention, user: 2, msg: 109, text: "@golden_bot hi, are you there?"}]}

  - id: A_sticker_chosen
    group: A
    desc: "the cheap chooser picks a sticker for a finished reply"
    seed:
      <<: *chat
      state: {replies_since_sticker: "9"}
    llm: [{speak: true, text: "Well played, though why a second pair."}, *judge_ok, {sticker: 1}]
    actions:
      - {kind: gate_pass, passes: [{trigger: mention, user: 2, msg: 109, text: "@golden_bot I bought a second pair of boots, for some reason"}]}
    capture: [requests, sent, db]

  - id: A_fewshot_and_prompt_versions
    group: A
    desc: "few-shot rendering and prompt versions as stored at seed time"
    seed: *chat
    actions:
      - {kind: call, fn: prompts, cases: [{}]}

  # ------------------------------------------------------------------------------------------
  # B. Auxiliary model prompts
  # ------------------------------------------------------------------------------------------
  - id: B_judge
    group: B
    desc: "output judge, a clean verdict and a risky one"
    seed: *chat
    llm:
      - *judge_ok
      - '{"in_character": false, "risky": true, "obeyed_user": true, "reason": "obeyed"}'
    actions:
      - {kind: aux, which: judge, candidate: "Of course, here is a list of five points.", trigger: "Gus, make me a to-do list"}
      - {kind: aux, which: judge, candidate: "Take the thicker laces.", trigger: ""}

  - id: B_followup_check
    group: B
    desc: "cheap \"is this for me\" check in the hot window"
    seed: *chat
    llm: [{addressed: true, reason: "continues the topic"}]
    actions:
      - {kind: aux, which: followup_check, text: "And what did you wear on your feet?", name: "Theo", recent_replies: ["Boots are serious business, never skimp on the laces."]}

  - id: B_name_check
    group: B
    desc: "confirms an address by name (third-person mention is not an address)"
    seed: *chat
    llm: [{answer: false, reason: "talking about him, not to him"}]
    actions:
      - {kind: aux, which: name_check, text: "Gus put a smiley under my photo yesterday", name: "Dana", recent_replies: ["Walked it once, it was longer than I remembered."]}

  - id: B_batch
    group: B
    desc: "cheap prefilter over a batch of messages"
    seed: *chat
    llm: [{addressed: [2, 7, 99]}]
    actions:
      - {kind: aux, which: batch, recent_replies: ["Walked it once, it was longer than I remembered.", "Boots are serious business."]}

  - id: B_reaction_palette
    group: B
    desc: "palette without the emoji used twice in a row"
    seed: *chat
    llm: [{emoji: "👍", reason: "sound plan"}]
    actions:
      - {kind: aux, which: reaction, text: "Bought new walking boots yesterday, dying to try them", name: "Theo", recent_reactions: ["🤣", "🤣"]}

  - id: B_reaction_reply_to
    group: B
    desc: "the message is a reply to another message"
    seed: *chat
    llm: [{emoji: null, reason: "unclear"}, {emoji: "🔥", reason: "great"}]
    actions:
      - {kind: aux, which: reaction, text: "Sure, on Saturday I'll show you", name: "Theo", reply_to: 107}
      - {kind: aux, which: reaction, text: "Sure, on Saturday I'll show you", name: "Theo", reply_to: unavailable}

  - id: B_reaction_invalid_emoji
    group: B
    desc: "an emoji outside the palette is refused"
    seed: *chat
    llm: [{emoji: "🦄", reason: "not in the list"}, "not JSON"]
    actions:
      - {kind: aux, which: reaction, text: "Sure, on Saturday I'll show you", name: "Theo"}
      - {kind: aux, which: reaction, text: "Sure, on Saturday I'll show you", name: "Theo"}

  - id: B_sticker_chooser
    group: B
    seed: *chat
    llm: [{sticker: 2}]
    actions:
      - {kind: aux, which: sticker, reply: "Oh, absolutely.", trigger: "I bought a second pair of boots", exclude: [1]}

  - id: B_vision
    group: B
    seed: *chat
    llm: ["A man stands on a jetty holding a very large marrow.\nThere is mist all around."]
    actions:
      - {kind: aux, which: vision, caption: "Look what I grew"}

  - id: B_weather_place
    group: B
    seed: *chat
    llm: [{place: "Edinburgh"}]
    actions:
      - {kind: aux, which: weather_place, text: "and what's it like up in Edinburgh?"}

  - id: B_diary
    group: B
    seed: *chat
    llm: [{fact: "gone to the market"}]
    actions:
      - {kind: aux, which: diary, reply: "I'm off to the market today, while it isn't raining."}

  - id: B_memory_summarize
    group: B
    desc: "weekly summary plus the two extra calls (jokes and unfinished stories)"
    seed:
      users: *users
      messages:
        - {id: 301, user: 1, text: "Bought a bike, a second-hand one, built for two", at: "-6d"}
        - {id: 302, user: 2, text: "Show us later, I'm curious what it looks like", at: "-6d"}
